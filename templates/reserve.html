{% extends "base.html" %}

{% block content %}

<h1>Reserve Bread</h1>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="POST" action="{{ url_for('reserve') }}">
    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <p>
        <label for="customer_name">Name:</label>
        <input 
            type="text" 
            id="customer_name" 
            name="customer_name" 
            value="{{ customer_name | default('') }}"
            minlength="2"
            maxlength="100" 
            required
        >
    </p>

    <p>
        <label for="phone">Phone number:</label>
        <input 
            type="tel" 
            id="phone" 
            name="phone" 
            value="{{ phone | default('') }}" 
            required
        >
    </p>

    <p>
        <label for="delivery_date">Production date:</label>
        <select
            id="delivery_date"
            name="delivery_date"
            required
        >
            <option value="">
                Select a production date
            </option>

            {% for day in available_days %}
                <option
                    value="{{ day.date_value }}"
                    data-remaining-capacity="{{ day.remaining_capacity }}"
                    {% if delivery_date | default('') == day.date_value %}
                        selected
                    {% endif %}
                    {% if day.sold_out %}
                        disabled
                    {% endif %}
                >
                    {{ day.weekday }}
                    — {{ day.date_display }}
                    —
                    {% if day.sold_out %}
                        Sold out
                    {% else %}
                        {{ day.remaining_capacity }}
                        breads available
                    {% endif %}
                </option>
            {% endfor %}
        </select>
    </p>

    <p>
        <label for="quantity">Quantity:</label>
        <input
            type="number"
            id="quantity"
            name="quantity"
            value="{{ quantity | default('3') }}"
            min="1"
            max="21"
            step="1"
            required
        >
        <span id="quantity-help">
            Select a production date to see the available quantity.
        </span>
    </p>

    <button type="submit">Continue</button>
</form>

<script>
    const deliveryDateSelect = document.getElementById(
        "delivery_date"
    );

    const quantityInput = document.getElementById(
        "quantity"
    );

    const quantityHelp = document.getElementById(
        "quantity-help"
    );

    function updateQuantityLimit() {
        const selectedOption =
            deliveryDateSelect.options[
                deliveryDateSelect.selectedIndex
            ];

        const remainingCapacity = Number(
            selectedOption.dataset.remainingCapacity
        );

        if (
            !selectedOption.value ||
            !Number.isInteger(remainingCapacity)
        ) {
            quantityInput.max = "21";

            quantityHelp.textContent =
                "Select a production date to see the available quantity.";

            return;
        }

        quantityInput.max = String(
            remainingCapacity
        );

        quantityHelp.textContent =
            `Maximum available for this date: ${remainingCapacity}`;

        if (
            Number(quantityInput.value) >
            remainingCapacity
        ) {
            quantityInput.value = String(
                remainingCapacity
            );
        }
    }

    deliveryDateSelect.addEventListener(
        "change",
        updateQuantityLimit
    );

    updateQuantityLimit();
</script>

{% endblock %}
